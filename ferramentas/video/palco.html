<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Palco da apresentação</title>
<style>
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1280px; height: 720px; overflow: hidden; background: #0b0b0b; font-family: "Segoe UI", system-ui, sans-serif; color: #fff; }
  body { background: radial-gradient(ellipse at top, #2a1a08 0%, #0b0b0b 65%); }
  #topo { position: absolute; top: 0; left: 0; right: 0; height: 50px; display: flex; align-items: center; gap: 12px; padding: 0 20px; }
  #topo img { height: 34px; border-radius: 50%; }
  #topo .marca { font-weight: 800; font-style: italic; text-transform: uppercase; letter-spacing: .04em; }
  #topo .titulo { margin-left: auto; color: #F7931E; font-weight: 700; font-size: 18px; text-transform: uppercase; letter-spacing: .05em; }
  #moldura { position: absolute; transition: all .6s ease; overflow: hidden; border-radius: 12px; border: 1px solid #333; background: #0F0F0F; box-shadow: 0 20px 60px rgba(0,0,0,.6); }
  #app { border: 0; transform-origin: 0 0; transition: transform .6s ease, width .6s ease, height .6s ease; background: #0F0F0F; }
  /* desktop */
  body.desktop #moldura { left: 20px; top: 56px; width: 1240px; height: 570px; }
  body.desktop #app { width: 1240px; height: 570px; transform: scale(1); }
  /* celular */
  body.celular #moldura { left: 150px; top: 58px; width: 340px; height: 650px; border-radius: 36px; border: 10px solid #1d1d1d; box-shadow: 0 0 0 2px #333, 0 30px 80px rgba(0,0,0,.7); }
  body.celular #app { width: 390px; height: 788px; transform: scale(.82); }
  body.capa #moldura { opacity: 0; left: 340px; top: 120px; width: 600px; height: 400px; }
  #legenda { position: absolute; left: 20px; right: 20px; bottom: 14px; min-height: 64px; padding: 10px 18px; border-radius: 12px;
    background: rgba(15,15,15,.92); border: 1px solid #F7931E55; font-size: 21px; line-height: 1.3; display: flex; align-items: center; transition: all .6s ease; }
  body.celular #legenda { left: 560px; right: 50px; bottom: auto; top: 250px; min-height: 200px; font-size: 28px; line-height: 1.35; border-left: 5px solid #F7931E; }
  body.celular #tituloLado { opacity: 1; }
  #tituloLado { position: absolute; left: 560px; top: 150px; font-size: 40px; font-weight: 800; font-style: italic; text-transform: uppercase; color: #F7931E; opacity: 0; transition: opacity .6s; max-width: 680px; }
  body.capa #legenda { left: 140px; right: 140px; bottom: 28px; font-size: 24px; justify-content: center; text-align: center; }
  #capa { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; padding-top: 62px; gap: 14px; opacity: 0; transition: opacity .7s; pointer-events: none; }
  body.capa #capa { opacity: 1; }
  #capa img { width: 360px; border-radius: 16px; box-shadow: 0 20px 60px rgba(0,0,0,.6); }
  #capa h1 { font-size: 34px; font-weight: 800; font-style: italic; text-transform: uppercase; letter-spacing: .03em; }
  #capa ul { list-style: none; display: flex; gap: 14px; flex-wrap: wrap; justify-content: center; max-width: 1000px; padding: 0; }
  #capa li { padding: 8px 16px; border-radius: 999px; background: #F7931E22; border: 1px solid #F7931E66; color: #FFB24D; font-weight: 600; font-size: 18px; }
  body.capa #topo .titulo { opacity: 0; }
  #cursor { position: absolute; left: 640px; top: 400px; width: 26px; height: 26px; margin: -13px 0 0 -13px; border-radius: 50%; background: rgba(247,147,30,.35); border: 3px solid #F7931E;
    box-shadow: 0 0 0 4px rgba(0,0,0,.35); transition: left .45s ease, top .45s ease, transform .15s; pointer-events: none; z-index: 10; opacity: 0; }
  #cursor.ativo { opacity: 1; }
  #cursor.clique { transform: scale(.7); background: rgba(247,147,30,.8); }
</style>
</head>
<body class="capa">
  <div id="topo"><img src="icon-192.png" alt=""><span class="marca">Bruno Mecânica Diesel</span><span class="titulo" id="titulo"></span></div>
  <div id="moldura"><iframe id="app" src="http://localhost:4173/bruno-mecanica-diesel/"></iframe></div>
  <div id="capa"><img src="logo.png" alt=""><h1 id="capaTitulo">Sistema de Gestão</h1><ul id="capaItens"></ul></div>
  <div id="tituloLado"></div>
  <div id="legenda"></div>
  <div id="cursor"></div>
<script>
  window.cena = ({ modo, titulo, legenda, capaTitulo, capaItens }) => {
    document.body.className = modo
    document.getElementById('titulo').textContent = titulo || ''
    document.getElementById('tituloLado').textContent = titulo || ''
    document.getElementById('legenda').textContent = legenda || ''
    if (capaTitulo) document.getElementById('capaTitulo').textContent = capaTitulo
    document.getElementById('capaItens').innerHTML = (capaItens || []).map((t) => `<li>${t}</li>`).join('')
    document.getElementById('cursor').classList.toggle('ativo', modo !== 'capa')
  }
  window.moverCursor = (x, y) => { const c = document.getElementById('cursor'); c.style.left = x + 'px'; c.style.top = y + 'px' }
  window.cliqueCursor = () => { const c = document.getElementById('cursor'); c.classList.add('clique'); setTimeout(() => c.classList.remove('clique'), 180) }
</script>
</body>
</html>
