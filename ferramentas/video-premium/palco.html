<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Palco premium</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Saira+Condensed:ital,wght@0,700;0,800;1,800&display=swap" rel="stylesheet">
<style>
  :root { --brand: #F7931E; --brand2: #FFB24D; --ease: cubic-bezier(.65,0,.35,1); }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  /* camadas decorativas nunca recebem clique: só o app (dentro de #mundo) é clicável */
  body > *:not(#mundo) { pointer-events: none !important; }
  html, body { width: 1920px; height: 1080px; overflow: hidden; background: #060606; font-family: Inter, system-ui, sans-serif; color: #fff; }

  /* ---------- fundo vivo ---------- */
  #fundo { position: absolute; inset: 0; background: radial-gradient(1300px 800px at 15% 0%, #3b2208 0%, transparent 60%), radial-gradient(1000px 700px at 90% 100%, #2b1505 0%, transparent 60%), #060606; }
  #brilho { position: absolute; width: 1500px; height: 1500px; border-radius: 50%; left: -300px; top: -600px; background: radial-gradient(circle, rgba(247,147,30,.20), transparent 62%); animation: vaguear 20s ease-in-out infinite alternate; }
  #brilho2 { position: absolute; width: 1100px; height: 1100px; border-radius: 50%; right: -300px; bottom: -500px; background: radial-gradient(circle, rgba(193,68,14,.18), transparent 62%); animation: vaguear2 24s ease-in-out infinite alternate; }
  @keyframes vaguear { to { transform: translate(1000px, 450px); } }
  @keyframes vaguear2 { to { transform: translate(-900px, -350px); } }
  #grade { position: absolute; inset: 0; background-image: linear-gradient(rgba(255,255,255,.04) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.04) 1px, transparent 1px); background-size: 72px 72px; -webkit-mask-image: radial-gradient(ellipse at center, #000 25%, transparent 75%); animation: grade 30s linear infinite; }
  @keyframes grade { to { background-position: 72px 72px, 72px 72px; } }
  #vinheta { position: absolute; inset: 0; background: radial-gradient(ellipse at center, transparent 55%, rgba(0,0,0,.78)); pointer-events: none; z-index: 60; }
  #grao { position: absolute; inset: -50%; opacity: .07; pointer-events: none; z-index: 61; animation: grao .8s steps(5) infinite;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>"); }
  @keyframes grao { 0% { transform: translate(0,0) } 20% { transform: translate(-4%,3%) } 40% { transform: translate(3%,-4%) } 60% { transform: translate(-2%,-3%) } 80% { transform: translate(4%,2%) } 100% { transform: translate(0,0) } }

  /* ---------- barra da marca ---------- */
  #marca { position: absolute; left: 56px; top: 34px; display: flex; align-items: center; gap: 14px; z-index: 50; transition: opacity .6s; }
  #marca img { width: 46px; height: 46px; border-radius: 50%; box-shadow: 0 0 0 2px rgba(247,147,30,.5); }
  #marca span { font-family: 'Saira Condensed', sans-serif; font-weight: 800; font-style: italic; text-transform: uppercase; font-size: 24px; letter-spacing: .05em; }
  #chip { position: absolute; right: 56px; top: 38px; z-index: 50; display: flex; align-items: center; gap: 12px; padding: 8px 18px 8px 8px; border-radius: 999px;
    background: rgba(20,20,20,.75); border: 1px solid rgba(247,147,30,.35); backdrop-filter: blur(6px); transform: translateY(-80px); opacity: 0; transition: transform .7s var(--ease), opacity .7s; }
  #chip.on { transform: none; opacity: 1; }
  #chip b { width: 38px; height: 38px; border-radius: 50%; background: var(--brand); color: #000; display: grid; place-items: center; font-family: 'Saira Condensed'; font-weight: 800; font-size: 20px; }
  #chip span { font-family: 'Saira Condensed'; font-weight: 800; font-style: italic; text-transform: uppercase; font-size: 22px; letter-spacing: .04em; }
  body.intro #marca, body.fim #marca { opacity: 0; }

  /* ---------- mundo (câmera) ---------- */
  #mundo { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; transform-origin: 0 0; transition: transform 1.1s var(--ease); perspective: 2400px; }
  #aparelho { position: absolute; background: linear-gradient(160deg, #1d1d1d, #0e0e0e); border: 1px solid #2d2d2d;
    box-shadow: 0 50px 140px rgba(0,0,0,.75), 0 0 0 1px rgba(255,255,255,.03) inset, 0 0 120px rgba(247,147,30,.12);
    transition: transform 1.3s cubic-bezier(.16,1,.3,1), opacity .8s; transform-style: preserve-3d; }
  #aparelho iframe { position: absolute; border: 0; background: #0F0F0F; }
  #aparelho .barra { position: absolute; left: 0; right: 0; top: 0; height: 34px; display: flex; gap: 9px; align-items: center; padding: 0 16px; }
  #aparelho .barra i { width: 12px; height: 12px; border-radius: 50%; background: #3a3a3a; }
  #aparelho .barra i:first-child { background: #F7931E; }
  #aparelho .barra em { margin-left: 18px; font-style: normal; font-size: 13px; color: #777; letter-spacing: .02em; }
  #aparelho .notch { display: none; position: absolute; left: 50%; top: 10px; width: 120px; height: 26px; margin-left: -60px; border-radius: 20px; background: #000; z-index: 2; }
  #reflexo { position: absolute; inset: 0; border-radius: inherit; pointer-events: none; background: linear-gradient(115deg, rgba(255,255,255,.07) 0%, transparent 35%); }
  body.desktop #aparelho, body.intro #aparelho, body.fim #aparelho { left: 230px; top: 128px; width: 1460px; height: 856px; border-radius: 18px; }
  body.desktop #aparelho iframe, body.intro #aparelho iframe, body.fim #aparelho iframe { left: 10px; top: 36px; width: 1440px; height: 810px; border-radius: 0 0 10px 10px; }
  body.celular #aparelho { left: 1250px; top: 92px; width: 424px; height: 896px; border-radius: 58px; border: 2px solid #3a3a3a; }
  body.celular #aparelho iframe { left: 17px; top: 26px; width: 390px; height: 844px; border-radius: 42px; }
  body.celular #aparelho .barra { display: none; }
  body.celular #aparelho .notch { display: block; }
  body.intro #aparelho, body.fim #aparelho { opacity: 0; transform: translateY(80px) scale(.9); }
  #aparelho.entrada { transform: rotateY(-24deg) rotateX(8deg) translateX(160px) translateZ(-200px) scale(.9) !important; opacity: 0 !important; }
  #aparelho.entradaCel { transform: rotateY(28deg) rotateX(6deg) translateX(-220px) translateZ(-200px) scale(.88) !important; opacity: 0 !important; }

  /* ---------- texto lateral (modo celular) ---------- */
  #lado { position: absolute; left: 140px; top: 300px; width: 960px; z-index: 30; opacity: 0; transform: translateX(-60px); transition: opacity .8s, transform .8s var(--ease); }
  body.celular #lado.on { opacity: 1; transform: none; }
  #lado .num { font-family: 'Saira Condensed'; font-weight: 800; font-size: 30px; color: var(--brand); letter-spacing: .1em; }
  #lado h2 { font-family: 'Saira Condensed'; font-weight: 800; font-style: italic; text-transform: uppercase; font-size: 92px; line-height: .95; margin-top: 6px;
    background: linear-gradient(90deg, #fff 0%, #ffd9a8 60%, var(--brand) 100%); -webkit-background-clip: text; background-clip: text; color: transparent; }
  #lado .traco { width: 120px; height: 6px; border-radius: 3px; background: var(--brand); margin: 26px 0; box-shadow: 0 0 30px rgba(247,147,30,.7); }

  /* ---------- legendas ---------- */
  #legenda { position: absolute; left: 50%; bottom: 44px; transform: translateX(-50%); z-index: 55; max-width: 1400px; text-align: center;
    font-size: 34px; font-weight: 600; line-height: 1.3; padding: 14px 30px; border-radius: 16px; background: rgba(8,8,8,.72); border: 1px solid rgba(247,147,30,.25);
    backdrop-filter: blur(8px); text-shadow: 0 2px 10px rgba(0,0,0,.6); opacity: 0; transition: opacity .35s; }
  #legenda.on { opacity: 1; }
  body.celular #legenda { left: 140px; transform: none; bottom: auto; top: 560px; max-width: 960px; text-align: left; font-size: 40px; background: transparent; border: 0; padding: 0; backdrop-filter: none; color: #f2f2f2; }
  body.intro #legenda, body.fim #legenda { bottom: 54px; }

  /* ---------- vinheta de capítulo ---------- */
  #capitulo { position: absolute; inset: 0; z-index: 70; pointer-events: none; }
  #capitulo .painel { position: absolute; inset: 0; background: #0a0a0a; clip-path: inset(0 100% 0 0); transition: clip-path .55s var(--ease); }
  #capitulo .faixa { position: absolute; top: 0; bottom: 0; width: 260px; left: -300px; background: linear-gradient(90deg, transparent, var(--brand), #ffcf8a, var(--brand), transparent); transform: skewX(-18deg); opacity: .9; }
  #capitulo.on .painel { clip-path: inset(0 0 0 0); }
  #capitulo.sai .painel { clip-path: inset(0 0 0 100%); }
  #capitulo.on .faixa { animation: varrer .9s var(--ease) forwards; }
  @keyframes varrer { from { left: -300px; } to { left: 2000px; } }
  #capitulo .conteudo { position: absolute; left: 0; right: 0; top: 50%; transform: translateY(-50%); text-align: center; opacity: 0; transition: opacity .3s .2s; }
  #capitulo.on .conteudo { opacity: 1; }
  #capitulo.sai .conteudo { opacity: 0; transition-delay: 0s; }
  #capitulo .n { font-family: 'Saira Condensed'; font-weight: 800; font-size: 220px; line-height: .8; color: transparent; -webkit-text-stroke: 3px var(--brand); opacity: .9; }
  #capitulo .t { font-family: 'Saira Condensed'; font-weight: 800; font-style: italic; text-transform: uppercase; font-size: 76px; letter-spacing: .04em; margin-top: 10px; }
  #capitulo .t, #capitulo .n { transform: translateY(30px); transition: transform .7s var(--ease); }
  #capitulo.on .t, #capitulo.on .n { transform: none; }

  /* ---------- abertura / encerramento ---------- */
  .tela { position: absolute; inset: 0; z-index: 45; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 26px; pointer-events: none; opacity: 0; transition: opacity .8s; }
  body.intro #intro, body.fim #fim { opacity: 1; }
  .logo { position: relative; width: 640px; border-radius: 22px; overflow: hidden; box-shadow: 0 40px 120px rgba(0,0,0,.8), 0 0 140px rgba(247,147,30,.25); transform: scale(.7); filter: blur(18px) brightness(.3); opacity: 0;
    transition: transform 1.6s cubic-bezier(.16,1,.3,1), filter 1.4s, opacity 1s; }
  .logo img { display: block; width: 100%; }
  .logo::after { content: ''; position: absolute; top: 0; bottom: 0; width: 160px; left: -200px; background: linear-gradient(90deg, transparent, rgba(255,255,255,.45), transparent); transform: skewX(-20deg); }
  .tela.on .logo { transform: scale(1); filter: none; opacity: 1; }
  .tela.on .logo::after { animation: luz 1.4s 1.2s ease-out forwards; }
  @keyframes luz { to { left: 760px; } }
  .tela h1 { font-family: 'Saira Condensed'; font-weight: 800; font-style: italic; text-transform: uppercase; font-size: 64px; letter-spacing: .3em; opacity: 0; transition: letter-spacing 1.4s var(--ease) .8s, opacity 1s .8s; }
  .tela.on h1 { letter-spacing: .05em; opacity: 1; }
  .tela ul { list-style: none; display: flex; gap: 16px; flex-wrap: wrap; justify-content: center; max-width: 1500px; }
  .tela li { padding: 12px 24px; border-radius: 999px; background: rgba(247,147,30,.12); border: 1px solid rgba(247,147,30,.5); color: var(--brand2); font-weight: 600; font-size: 26px;
    opacity: 0; transform: translateY(24px); transition: opacity .6s, transform .6s var(--ease); }
  .tela li.on { opacity: 1; transform: none; }
  #fim .slogan { font-family: 'Saira Condensed'; font-weight: 800; font-style: italic; font-size: 44px; color: var(--brand); text-transform: uppercase; letter-spacing: .06em; opacity: 0; transition: opacity 1s; text-shadow: 0 0 40px rgba(247,147,30,.6); }
  #fim .slogan.on { opacity: 1; }

  /* ---------- cursor ---------- */
  #cursor { position: absolute; left: 960px; top: 600px; width: 34px; height: 34px; margin: -17px 0 0 -17px; border-radius: 50%; z-index: 58; pointer-events: none;
    background: rgba(247,147,30,.25); border: 3px solid var(--brand); box-shadow: 0 0 0 6px rgba(0,0,0,.25), 0 0 24px rgba(247,147,30,.6);
    transition: left .5s cubic-bezier(.4,0,.2,1), top .5s cubic-bezier(.4,0,.2,1), opacity .4s, transform .15s; opacity: 0; }
  #cursor.on { opacity: 1; }
  #cursor.clique { transform: scale(.65); background: rgba(247,147,30,.85); }
  .onda { position: absolute; width: 34px; height: 34px; margin: -17px 0 0 -17px; border-radius: 50%; border: 3px solid var(--brand); z-index: 57; pointer-events: none; animation: onda .6s ease-out forwards; }
  @keyframes onda { to { transform: scale(3.2); opacity: 0; } }
</style>
</head>
<body class="intro">
  <div id="fundo"></div><div id="brilho"></div><div id="brilho2"></div><div id="grade"></div>
  <div id="marca"><img src="icon-192.png" alt=""><span>Bruno Mecânica Diesel</span></div>
  <div id="chip"><b id="chipN">01</b><span id="chipT"></span></div>

  <div id="mundo">
    <div id="aparelho">
      <div class="barra"><i></i><i></i><i></i><em>bruno-mecanica-diesel</em></div>
      <div class="notch"></div>
      <iframe id="app" src="http://localhost:4173/bruno-mecanica-diesel/"></iframe>
      <div id="reflexo"></div>
    </div>
  </div>

  <div id="lado"><div class="num" id="ladoN"></div><h2 id="ladoT"></h2><div class="traco"></div></div>
  <div id="legenda"></div>

  <div id="intro" class="tela">
    <div class="logo"><img src="logo.png" alt=""></div>
    <h1>Sistema de Gestão da Oficina</h1>
    <ul id="introItens"></ul>
  </div>
  <div id="fim" class="tela">
    <div class="logo"><img src="logo.png" alt=""></div>
    <h1>Próximos passos</h1>
    <ul id="fimItens"></ul>
    <div class="slogan" id="slogan">A oficina organizada, do pátio ao caixa</div>
  </div>

  <div id="capitulo"><div class="painel"></div><div class="faixa"></div><div class="conteudo"><div class="n" id="capN"></div><div class="t" id="capT"></div></div></div>
  <div id="cursor"></div>
  <div id="vinheta"></div><div id="grao"></div>

<script>
  const $ = (id) => document.getElementById(id)
  const espera = (ms) => new Promise((r) => setTimeout(r, ms))
  let timersLegenda = []

  window.modo = (m) => { document.body.className = m; $('cursor').classList.toggle('on', m === 'desktop' || m === 'celular') }

  window.capitulo = async (n, titulo) => {
    $('capN').textContent = n; $('capT').textContent = titulo
    const c = $('capitulo'); c.className = ''; void c.offsetWidth; c.classList.add('on')
    await espera(650)
  }
  window.fecharCapitulo = async () => { const c = $('capitulo'); c.classList.add('sai'); await espera(600); c.className = '' }

  window.manchete = (n, titulo) => {
    $('chipN').textContent = n; $('chipT').textContent = titulo; $('chip').classList.add('on')
    $('ladoN').textContent = n; $('ladoT').textContent = titulo
    const l = $('lado'); l.classList.remove('on'); void l.offsetWidth; l.classList.add('on')
  }
  window.semManchete = () => { $('chip').classList.remove('on'); $('lado').classList.remove('on') }

  /** Legendas frase a frase: tempos em ms relativos a agora. */
  window.legendas = (frases) => {
    timersLegenda.forEach(clearTimeout); timersLegenda = []
    const el = $('legenda')
    frases.forEach(({ texto, ini, fim }) => {
      timersLegenda.push(setTimeout(() => { el.textContent = texto; el.classList.add('on') }, ini))
      timersLegenda.push(setTimeout(() => { if (el.textContent === texto) el.classList.remove('on') }, fim))
    })
  }

  window.entrada = async (tipo) => {
    const a = $('aparelho'); const cls = tipo === 'celular' ? 'entradaCel' : 'entrada'
    a.style.transition = 'none'; a.classList.add(cls); void a.offsetWidth; a.style.transition = ''
    await espera(60); a.classList.remove(cls)
  }

  /** Câmera: centraliza um retângulo do app (coordenadas internas do iframe) com zoom. */
  window.focar = (r, escala, alvoY = 520) => {
    const a = $('aparelho'), f = $('app')
    const ox = a.offsetLeft + f.offsetLeft, oy = a.offsetTop + f.offsetTop
    const cx = ox + r.x + r.w / 2, cy = oy + r.y + r.h / 2
    const s = escala, tx = 960 - cx * s, ty = alvoY - cy * s
    $('mundo').style.transform = `translate(${tx}px, ${ty}px) scale(${s})`
  }
  window.camera = (tx = 0, ty = 0, s = 1) => { $('mundo').style.transform = `translate(${tx}px, ${ty}px) scale(${s})` }

  window.cursor = (x, y) => { const c = $('cursor'); c.style.left = x + 'px'; c.style.top = y + 'px' }
  window.clique = () => {
    const c = $('cursor'); c.classList.add('clique'); setTimeout(() => c.classList.remove('clique'), 160)
    const o = document.createElement('div'); o.className = 'onda'; o.style.left = c.style.left; o.style.top = c.style.top
    document.body.appendChild(o); setTimeout(() => o.remove(), 700)
  }

  window.mostrarTela = async (id, itens, intervalo = 450) => {
    const t = $(id); const ul = t.querySelector('ul')
    ul.innerHTML = itens.map((x) => `<li>${x}</li>`).join('')
    t.classList.remove('on'); void t.offsetWidth; t.classList.add('on')
    await espera(1700)
    for (const li of ul.querySelectorAll('li')) { li.classList.add('on'); await espera(intervalo) }
  }
  window.slogan = () => $('slogan').classList.add('on')
</script>
</body>
</html>
